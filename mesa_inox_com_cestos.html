<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesa Inox com Cestos 3D</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #e5e7eb;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        #ui-layer {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.9);
            padding: 12px 24px;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            pointer-events: none;
            z-index: 10;
        }

        h1 { margin: 0; font-size: 16px; color: #1f2937; }
        p { margin: 4px 0 0 0; font-size: 12px; color: #6b7280; }
    </style>
</head>
<body>

    <div id="ui-layer">
        <h1>Mesa Comercial & Cestos</h1>
        <p>Arraste para rodar • Role para zoom</p>
    </div>

    <div id="canvas-container"></div>

    <script>
        let scene, camera, renderer, controls;

        function init() {
            const container = document.getElementById('canvas-container');

            // 1. Configuração da Cena
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xe5e7eb); 
            scene.fog = new THREE.Fog(0xe5e7eb, 5, 25);

            // 2. Câmera
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(2.5, 2, 3.5);

            // 3. Renderizador
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            // 4. Controlos Orbitais
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.target.set(0, 0.45, 0); 
            controls.maxPolarAngle = Math.PI / 2 - 0.01; // Impede descer abaixo do chão
            controls.minDistance = 2;
            controls.maxDistance = 12;

            // 5. Iluminação
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);

            // Luz direcional principal (Sol) com sombras ativadas
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(5, 8, 5);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            scene.add(dirLight);

            // Luz de preenchimento
            const fillLight = new THREE.DirectionalLight(0xffffff, 0.4);
            fillLight.position.set(-5, 3, -5);
            scene.add(fillLight);

            // 6. Chão Cinza Claro
            const floorGeo = new THREE.PlaneGeometry(30, 30);
            const floorMat = new THREE.MeshStandardMaterial({ 
                color: 0xcccccc, 
                roughness: 0.8, 
                metalness: 0.1 
            });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            // Construir Mesa e Cestos
            buildTable();
            buildBaskets();

            window.addEventListener('resize', onWindowResize, false);
            animate();
        }

        function buildTable() {
            const tableGroup = new THREE.Group();

            // Material do Aço Inox
            const inoxMaterial = new THREE.MeshStandardMaterial({ 
                color: 0xdddddd, 
                roughness: 0.25, 
                metalness: 0.9 
            });

            // Material da Borracha
            const rubberMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x111111, 
                roughness: 0.9, 
                metalness: 0.1 
            });

            const tableWidth = 2.0;
            const tableDepth = 0.8;
            const tableHeight = 0.9;
            const legRadius = 0.02;

            // Tampo Superior
            const topGeo = new THREE.BoxGeometry(tableWidth, 0.04, tableDepth);
            const topMesh = new THREE.Mesh(topGeo, inoxMaterial);
            topMesh.position.set(0, tableHeight, 0);
            topMesh.castShadow = true;
            topMesh.receiveShadow = true;
            tableGroup.add(topMesh);

            // Prateleira Inferior
            const shelfGeo = new THREE.BoxGeometry(tableWidth - 0.05, 0.02, tableDepth - 0.05);
            const shelfMesh = new THREE.Mesh(shelfGeo, inoxMaterial);
            shelfMesh.position.set(0, tableHeight * 0.3, 0);
            shelfMesh.castShadow = true;
            shelfMesh.receiveShadow = true;
            tableGroup.add(shelfMesh);

            // Posições das pernas
            const xOffset = (tableWidth / 2) - 0.05;
            const zOffset = (tableDepth / 2) - 0.05;
            const legPositions = [
                [xOffset, zOffset], [-xOffset, zOffset],
                [xOffset, -zOffset], [-xOffset, -zOffset]
            ];

            const legGeo = new THREE.CylinderGeometry(legRadius, legRadius, tableHeight, 32);
            const footGeo = new THREE.CylinderGeometry(legRadius + 0.005, legRadius + 0.002, 0.04, 32);

            legPositions.forEach(pos => {
                const leg = new THREE.Mesh(legGeo, inoxMaterial);
                leg.position.set(pos[0], tableHeight / 2, pos[1]);
                leg.castShadow = true;
                leg.receiveShadow = true;
                tableGroup.add(leg);

                const foot = new THREE.Mesh(footGeo, rubberMaterial);
                foot.position.set(pos[0], 0.02, pos[1]);
                foot.castShadow = true;
                tableGroup.add(foot);
            });

            scene.add(tableGroup);
        }

        function createBasketAlphaMap() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');

            // Fundo Branco (visível/sólido)
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, 1024, 512);

            // Preto = Transparente (buracos e corte do topo)
            ctx.fillStyle = '#000000';
            
            // 1. Corte do Topo Ondulado (Alças)
            ctx.beginPath();
            ctx.moveTo(0, 0);
            for (let x = 0; x <= 1024; x += 5) {
                // Onda cosseno cria 2 picos (alças) e 2 vales em 1024px
                let angle = (x / 1024) * Math.PI * 4; 
                let y = 60 + Math.cos(angle) * 45; 
                ctx.lineTo(x, y);
            }
            ctx.lineTo(1024, 0);
            ctx.closePath();
            ctx.fill();

            // 2. Grade de Furos
            const radius = 14;
            const spacingX = 45;
            const spacingY = 45;
            
            for (let y = 130; y < 480; y += spacingY) {
                let isEvenRow = Math.floor(y / spacingY) % 2 === 0;
                let offsetX = isEvenRow ? 0 : spacingX / 2;
                
                for (let x = 0; x <= 1024; x += spacingX) {
                    ctx.beginPath();
                    ctx.arc(x + offsetX, y, radius, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.ClampToEdgeWrapping;
            return texture;
        }

        function buildBaskets() {
            const alphaTex = createBasketAlphaMap();
            
            // Material Plástico Branco Matte
            const basketMaterial = new THREE.MeshStandardMaterial({
                color: 0xffffff,
                roughness: 0.9,
                metalness: 0.05,
                alphaMap: alphaTex,
                alphaTest: 0.5,
                transparent: true,
                side: THREE.DoubleSide
            });

            // Material para a base (sem furos)
            const baseMaterial = new THREE.MeshStandardMaterial({
                color: 0xffffff,
                roughness: 0.9,
                metalness: 0.05
            });

            // Dimensões
            const basketHeight = 0.45;
            const radiusTop = 0.22;
            const radiusBottom = 0.16;

            // Geometria aberta do corpo
            const basketGeo = new THREE.CylinderGeometry(radiusTop, radiusBottom, basketHeight, 64, 1, true);
            
            // Geometria da base fechada
            const baseGeo = new THREE.CylinderGeometry(radiusBottom, radiusBottom, 0.01, 32);

            // Altura da prateleira (Y) + compensação
            const shelfHeight = 0.9 * 0.3; // tableHeight * 0.3
            const basketY = shelfHeight + (basketHeight / 2) + 0.01;

            // Posições em X para os 3 cestos
            const xPositions = [-0.6, 0, 0.6];

            xPositions.forEach(x => {
                const basketGroup = new THREE.Group();

                // Corpo do cesto
                const bodyMesh = new THREE.Mesh(basketGeo, basketMaterial);
                bodyMesh.castShadow = true;
                bodyMesh.receiveShadow = true;
                // Assegurar que os furos projetam sombra
                bodyMesh.customDepthMaterial = new THREE.MeshDepthMaterial({
                    depthPacking: THREE.RGBADepthPacking,
                    alphaMap: alphaTex,
                    alphaTest: 0.5
                });
                basketGroup.add(bodyMesh);

                // Base sólida
                const baseMesh = new THREE.Mesh(baseGeo, baseMaterial);
                baseMesh.position.set(0, -basketHeight / 2, 0);
                baseMesh.castShadow = true;
                baseMesh.receiveShadow = true;
                basketGroup.add(baseMesh);

                // Posicionar e rodar para as alças (picos do alpha) ficarem dos lados
                basketGroup.position.set(x, basketY, 0);
                basketGroup.rotation.y = Math.PI / 4; 

                scene.add(basketGroup);
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update(); 
            renderer.render(scene, camera);
        }

        // Iniciar
        window.onload = init;
    </script>
</body>
</html>
