<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo 3D - Cadeira Plástica Perfurada</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #ffffff; /* Fundo limpo para contrastar com a cadeira cinza */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        #ui-layer {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.9);
            padding: 12px 24px;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            text-align: center;
            pointer-events: none;
            z-index: 10;
        }

        h1 { margin: 0; font-size: 16px; color: #1f2937; font-weight: 600; }
        p { margin: 4px 0 0 0; font-size: 12px; color: #6b7280; }
    </style>
</head>
<body>

    <div id="ui-layer">
        <h1>Cadeira Plástica Monobloco</h1>
        <p>Arraste para rodar • Role para zoom</p>
    </div>
    
    <div id="canvas-container"></div>

    <script>
        let scene, camera, renderer, controls;

        function init() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xf0f2f5);
            scene.fog = new THREE.Fog(0xf0f2f5, 2, 10);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(1.5, 1.2, 2.0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.target.set(0, 0.45, 0); 
            controls.maxPolarAngle = Math.PI / 2 - 0.01;
            controls.minDistance = 1;
            controls.maxDistance = 6;

            setupLighting();
            buildChair();
            buildEnvironment();

            window.addEventListener('resize', onWindowResize, false);
            animate();
        }

        function setupLighting() {
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const keyLight = new THREE.DirectionalLight(0xffffff, 0.7);
            keyLight.position.set(3, 5, 4);
            keyLight.castShadow = true;
            keyLight.shadow.mapSize.width = 2048;
            keyLight.shadow.mapSize.height = 2048;
            scene.add(keyLight);

            const fillLight = new THREE.DirectionalLight(0xe0e7ff, 0.3);
            fillLight.position.set(-3, 3, -2);
            scene.add(fillLight);
        }

        function createHoleTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');

            // Fundo branco (Onde for branco, o material será opaco)
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, 512, 512);

            // Desenhar os furos circulares (Transparente)
            ctx.globalCompositeOperation = 'destination-out';
            
            const radius = 10;
            const spacing = 35;
            
            // Padrão intercalado (favo de mel) para os furos
            for (let y = 20; y < 512; y += spacing) {
                let isEvenRow = Math.floor(y / spacing) % 2 === 0;
                let offsetX = isEvenRow ? 0 : spacing / 2;
                
                for (let x = 10; x < 512; x += spacing) {
                    ctx.beginPath();
                    ctx.arc(x + offsetX, y, radius, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(1.5, 1.2); // Escalar o padrão
            return texture;
        }

        function buildChair() {
            const chairGroup = new THREE.Group();

            const chairColor = 0x5a5c5d; // Cinza escuro matte

            // Material do plástico liso
            const plasticMaterial = new THREE.MeshStandardMaterial({ 
                color: chairColor, 
                roughness: 0.7, 
                metalness: 0.1 
            });

            // Material da parte perfurada (usa Alpha Map)
            const perforatedMaterial = new THREE.MeshStandardMaterial({
                color: chairColor,
                roughness: 0.7,
                metalness: 0.1,
                alphaMap: createHoleTexture(),
                alphaTest: 0.5, // Descarta píxeis escuros do alphaMap (cria o furo real)
                side: THREE.DoubleSide
            });

            // 1. Assento (Curvado)
            const seatWidth = 0.42;
            const seatDepth = 0.42;
            const seatGeo = new THREE.BoxGeometry(seatWidth, 0.02, seatDepth, 16, 1, 16);
            
            // Curvar o assento ligeiramente para baixo nas pontas
            const pos = seatGeo.attributes.position;
            for(let i=0; i<pos.count; i++) {
                let x = pos.getX(i);
                let z = pos.getZ(i);
                let y = pos.getY(i);
                // Curvatura côncava
                y += (Math.pow(x, 2) + Math.pow(z, 2)) * 0.15;
                // Baixar a frente do assento para ergonomia
                if(z > 0) y -= z * 0.1;
                pos.setXYZ(i, x, y, z);
            }
            seatGeo.computeVertexNormals();

            const seat = new THREE.Mesh(seatGeo, plasticMaterial);
            seat.position.set(0, 0.45, 0);
            seat.castShadow = true;
            seat.receiveShadow = true;
            chairGroup.add(seat);

            // 2. Pernas Afiladas
            function createLeg(x, z, rotX, rotZ) {
                // Cilindro afunilado (raio topo, raio base, altura)
                const legGeo = new THREE.CylinderGeometry(0.015, 0.008, 0.46, 16);
                const leg = new THREE.Mesh(legGeo, plasticMaterial);
                leg.position.set(x, 0.23, z);
                leg.rotation.x = rotX;
                leg.rotation.z = rotZ;
                leg.castShadow = true;
                return leg;
            }

            // Posições das pernas abertas para fora
            const spread = 0.18;
            chairGroup.add(createLeg(-spread, spread, 0.1, 0.1));   // Frente Esquerda
            chairGroup.add(createLeg(spread, spread, 0.1, -0.1));    // Frente Direita
            chairGroup.add(createLeg(-spread, -spread, -0.1, 0.1));  // Trás Esquerda
            chairGroup.add(createLeg(spread, -spread, -0.1, -0.1));  // Trás Direita

            // 3. Estrutura do Encosto (Laterais sólidas que unem o assento ao topo)
            const backStrutGeo = new THREE.CylinderGeometry(0.015, 0.02, 0.25, 16);
            
            const leftStrut = new THREE.Mesh(backStrutGeo, plasticMaterial);
            leftStrut.position.set(-0.18, 0.58, -0.22);
            leftStrut.rotation.x = -0.2;
            leftStrut.castShadow = true;
            chairGroup.add(leftStrut);

            const rightStrut = new THREE.Mesh(backStrutGeo, plasticMaterial);
            rightStrut.position.set(0.18, 0.58, -0.22);
            rightStrut.rotation.x = -0.2;
            rightStrut.castShadow = true;
            chairGroup.add(rightStrut);

            // 4. Encosto Perfurado Superior
            const backWidth = 0.40;
            const backHeight = 0.35;
            const backGeo = new THREE.PlaneGeometry(backWidth, backHeight, 16, 16);
            
            const backPos = backGeo.attributes.position;
            for(let i=0; i<backPos.count; i++) {
                let x = backPos.getX(i);
                let y = backPos.getY(i);
                let z = 0;
                
                // Curvar o encosto para envolver as costas (forma de 'U' suave)
                z += Math.pow(x, 2) * 0.3;
                
                // Inclinar para trás
                z -= y * 0.1;
                
                // Ligeiro estreitamento no fundo
                if(y < 0) {
                    x = x * (1 - Math.abs(y)*0.2);
                }

                backPos.setXYZ(i, x, y, z);
            }
            backGeo.computeVertexNormals();

            // Usar o material perfurado com alphaTest
            const backrest = new THREE.Mesh(backGeo, perforatedMaterial);
            backrest.position.set(0, 0.75, -0.25);
            backrest.rotation.x = -0.15;
            backrest.castShadow = true;
            
            // Custom Depth Material para garantir que os buracos projetam sombra corretamente
            backrest.customDepthMaterial = new THREE.MeshDepthMaterial({
                depthPacking: THREE.RGBADepthPacking,
                alphaMap: perforatedMaterial.alphaMap,
                alphaTest: 0.5
            });

            chairGroup.add(backrest);

            // 5. O detalhe do Logotipo Azul
            const logoGeo = new THREE.BoxGeometry(0.04, 0.01, 0.005);
            const logoMat = new THREE.MeshStandardMaterial({ color: 0x0044cc, roughness: 0.3 });
            const logoMesh = new THREE.Mesh(logoGeo, logoMat);
            // Posicionado na borda inferior centro do encosto
            logoMesh.position.set(0, -0.16, 0.03); 
            logoMesh.rotation.x = 0.1;
            backrest.add(logoMesh);

            scene.add(chairGroup);
        }

        function buildEnvironment() {
            const floorGeo = new THREE.PlaneGeometry(15, 15);
            const floorMat = new THREE.MeshStandardMaterial({ 
                color: 0xe5e7eb, 
                roughness: 0.9,
                metalness: 0.0
            });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update(); 
            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
