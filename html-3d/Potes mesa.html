<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <title>Mesa de Lembranças - Frascos Cheios</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #f4f7f6; }
        #info {
            position: absolute;
            top: 10px;
            width: 100%;
            text-align: center;
            font-family: sans-serif;
            font-size: 18px;
            color: #555;
            pointer-events: none;
            text-shadow: 1px 1px 2px white;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="info">Clique e arraste para rodar | Scroll para zoom no líquido</div>
    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf4f7f6);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(2, 4, 3.5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.target.set(0, 3.2, 0);

        // Iluminação
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.7);
        dirLight.position.set(5, 10, 5);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // Luz de preenchimento para os reflexos do vidro
        const pointLight = new THREE.PointLight(0xffffff, 0.6);
        pointLight.position.set(-2, 5, 2);
        scene.add(pointLight);

        // Materiais
        const matWood = new THREE.MeshStandardMaterial({ color: 0xd2b48c, roughness: 0.8 });
        const matCloth = new THREE.MeshStandardMaterial({ 
            color: 0xcce6ff, roughness: 0.9, side: THREE.DoubleSide 
        });
        
        // Material do Vidro (transparente)
        const matGlass = new THREE.MeshPhysicalMaterial({ 
            color: 0xffffff, transmission: 1.0, opacity: 1, transparent: true, roughness: 0.05, ior: 1.5, clearcoat: 1.0
        });
        
        // Material do Líquido (Azul lavandaria intenso)
        const matLiquid = new THREE.MeshPhysicalMaterial({
            color: 0x2288ff, transmission: 0.5, opacity: 0.9, transparent: true, roughness: 0.1, ior: 1.33
        });

        // 1. Construir a Mesa e a Toalha
        const tableGroup = new THREE.Group();

        const topGeo = new THREE.BoxGeometry(3, 0.2, 2);
        const tableTop = new THREE.Mesh(topGeo, matWood);
        tableTop.position.y = 3.1;
        tableGroup.add(tableTop);

        const legGeo = new THREE.BoxGeometry(0.2, 3, 0.2);
        const legPositions = [
            [1.3, 1.5, 0.8], [-1.3, 1.5, 0.8],
            [1.3, 1.5, -0.8], [-1.3, 1.5, -0.8]
        ];
        legPositions.forEach(pos => {
            const leg = new THREE.Mesh(legGeo, matWood);
            leg.position.set(...pos);
            leg.castShadow = true;
            tableGroup.add(leg);
        });

        const clothDrop = 1.5;
        const dropY = 3.21 - (clothDrop / 2);

        const clothTopGeo = new THREE.PlaneGeometry(3.2, 2.2);
        const clothTop = new THREE.Mesh(clothTopGeo, matCloth);
        clothTop.rotation.x = -Math.PI / 2;
        clothTop.position.y = 3.21;
        clothTop.receiveShadow = true;
        tableGroup.add(clothTop);

        const clothFrontGeo = new THREE.PlaneGeometry(3.2, clothDrop);
        const clothFront = new THREE.Mesh(clothFrontGeo, matCloth);
        clothFront.position.set(0, dropY, 1.1);
        clothFront.castShadow = true;
        tableGroup.add(clothFront);

        const clothBack = new THREE.Mesh(clothFrontGeo, matCloth);
        clothBack.position.set(0, dropY, -1.1);
        clothBack.rotation.y = Math.PI;
        tableGroup.add(clothBack);

        const clothSideGeo = new THREE.PlaneGeometry(2.2, clothDrop);
        const clothRight = new THREE.Mesh(clothSideGeo, matCloth);
        clothRight.position.set(1.6, dropY, 0);
        clothRight.rotation.y = Math.PI / 2;
        clothRight.castShadow = true;
        tableGroup.add(clothRight);

        const clothLeft = new THREE.Mesh(clothSideGeo, matCloth);
        clothLeft.position.set(-1.6, dropY, 0);
        clothLeft.rotation.y = -Math.PI / 2;
        tableGroup.add(clothLeft);

        scene.add(tableGroup);

        // 2. Modelo do Frasco Cheio de Líquido
        function createBottle() {
            const bottleGroup = new THREE.Group();

            // Vidro Exterior
            const bodyGeo = new THREE.CylinderGeometry(0.12, 0.12, 0.35, 24);
            const body = new THREE.Mesh(bodyGeo, matGlass);
            body.position.y = 0.175;
            body.castShadow = true;
            bottleGroup.add(body);

            // Líquido Interior (ligeiramente menor que o vidro)
            const liquidGeo = new THREE.CylinderGeometry(0.105, 0.105, 0.30, 24);
            const liquid = new THREE.Mesh(liquidGeo, matLiquid);
            liquid.position.y = 0.16; // Nível do líquido um pouco abaixo do topo
            bottleGroup.add(liquid);

            // Gargalo
            const neckGeo = new THREE.CylinderGeometry(0.06, 0.06, 0.1, 16);
            const neck = new THREE.Mesh(neckGeo, matGlass);
            neck.position.y = 0.4;
            bottleGroup.add(neck);

            // Rolha
            const corkGeo = new THREE.CylinderGeometry(0.06, 0.05, 0.12, 16);
            const cork = new THREE.Mesh(corkGeo, matWood);
            cork.position.y = 0.5;
            bottleGroup.add(cork);

            return bottleGroup;
        }

        // 3. Posicionar os 10 frascos (2 filas de 5)
        const baseBottle = createBottle();
        const cols = 5; 
        const spacingX = 0.45; 
        const startX = -((cols - 1) * spacingX) / 2;

        for(let row = 0; row < 2; row++) {
            for(let col = 0; col < cols; col++) {
                const b = baseBottle.clone();
                const posX = startX + (col * spacingX);
                const posZ = row === 0 ? -0.25 : 0.25; 
                
                b.position.set(posX, 3.21, posZ);
                b.rotation.y = (Math.random() - 0.5) * 0.5; 
                
                scene.add(b);
            }
        }

        // Chão
        const floorGeo = new THREE.PlaneGeometry(100, 100);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0xdddddd, roughness: 1 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        // Loop de Animação
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
