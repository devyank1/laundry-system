<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <title>Bomba Hidráulica Pressurizadora 3D com Entrada e Saída</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #f0f0f0; }
        #info {
            position: absolute;
            top: 10px;
            width: 100%;
            text-align: center;
            font-family: sans-serif;
            font-size: 18px;
            color: #333;
            pointer-events: none;
            text-shadow: 1px 1px 2px white;
            z-index: 10;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="info">Clique e arraste o rato para rodar | Scroll para zoom | Entrada e Saída com Fluxo</div>
    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf0f0f0);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(5, 5.5, 7.5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.target.set(0, 1.8, 0);

        // Iluminação de Estúdio
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.65);
        scene.add(ambientLight);

        const mainLight = new THREE.DirectionalLight(0xffffff, 0.8);
        mainLight.position.set(6, 12, 6);
        mainLight.castShadow = true;
        scene.add(mainLight);

        const fillLight = new THREE.DirectionalLight(0xffffff, 0.4);
        fillLight.position.set(-6, 5, -3);
        scene.add(fillLight);

        // Materiais
        const matLightGrey = new THREE.MeshStandardMaterial({ color: 0xe6e6e6, roughness: 0.25 }); // Tanque
        const matDarkGrey = new THREE.MeshStandardMaterial({ color: 0x3d3d3d, roughness: 0.5, metalness: 0.4 }); // Bomba/Conexões
        const matBlack = new THREE.MeshStandardMaterial({ color: 0x1e1e1e, roughness: 0.7 }); // Motor/Suportes
        const matPlasticBlack = new THREE.MeshStandardMaterial({ color: 0x151515, roughness: 0.4 }); // Caixa de ligações
        const matMetalLight = new THREE.MeshStandardMaterial({ color: 0x999999, metalness: 0.8, roughness: 0.2 }); // Parafusos/Conexões
        const matWire = new THREE.MeshStandardMaterial({ color: 0xdca83a, roughness: 0.6 }); // Fio amarelo
        const matLabelBlack = new THREE.MeshBasicMaterial({ color: 0x222222 }); // Faixa da marca
        const matLabelYellow = new THREE.MeshBasicMaterial({ color: 0xd4af37 }); // Etiqueta especificações
        
        // Materiais das tubulações e água
        const matPipeIn = new THREE.MeshStandardMaterial({ color: 0x2b5282, roughness: 0.4 }); // Cano de Entrada (azul escuro)
        const matPipeOut = new THREE.MeshStandardMaterial({ color: 0x3182ce, roughness: 0.4 }); // Cano de Saída (azul claro)

        // Grupo Principal
        const pumpGroup = new THREE.Group();

        // 1. Base (Plataforma inferior preta)
        const baseGroup = new THREE.Group();
        const baseBottom = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.2, 2.4), matBlack);
        baseBottom.position.y = 0.1;
        baseBottom.castShadow = true;
        baseBottom.receiveShadow = true;
        baseGroup.add(baseBottom);
        
        // Cantos de fixação com furação e parafusos de fixação
        for(let x of [-1.1, 1.1]) {
            for(let z of [-1.1, 1.1]) {
                const foot = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.2, 16), matBlack);
                foot.position.set(x, 0.2, z);
                
                // Cabeça de parafuso na base
                const bolt = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.08, 6), matMetalLight);
                bolt.position.set(x, 0.32, z);
                baseGroup.add(bolt);
                baseGroup.add(foot);
            }
        }
        pumpGroup.add(baseGroup);

        // 2. Tanque de Pressão Superior (Cinzento-claro / Branco)
        const tankGroup = new THREE.Group();
        tankGroup.position.set(-0.3, 3.2, 0);

        // Corpo cilíndrico
        const tankBody = new THREE.Mesh(new THREE.CylinderGeometry(0.85, 0.85, 1.2, 32), matLightGrey);
        tankBody.castShadow = true;
        tankGroup.add(tankBody);

        // Cúpula superior
        const tankTop = new THREE.Mesh(new THREE.SphereGeometry(0.85, 32, 16, 0, Math.PI*2, 0, Math.PI/2), matLightGrey);
        tankTop.position.y = 0.6;
        tankTop.castShadow = true;
        tankGroup.add(tankTop);

        // Botão/Válvula no topo
        const valve = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.1, 16), matBlack);
        valve.position.y = 1.48;
        tankGroup.add(valve);

        // Base arredondada do tanque
        const tankBottom = new THREE.Mesh(new THREE.SphereGeometry(0.85, 32, 16, 0, Math.PI*2, Math.PI/2, Math.PI/2), matLightGrey);
        tankBottom.position.y = -0.6;
        tankBottom.castShadow = true;
        tankGroup.add(tankBottom);

        // Pescoço de ligação ao motor
        const tankNeck = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.45, 0.5, 16), matLightGrey);
        tankNeck.position.y = -1.2;
        tankNeck.castShadow = true;
        tankGroup.add(tankNeck);

        // Faixa da Marca (Preta)
        const brandBand = new THREE.Mesh(new THREE.CylinderGeometry(0.86, 0.86, 0.35, 32), matLabelBlack);
        brandBand.position.y = 0.45;
        tankGroup.add(brandBand);

        // Etiqueta de Especificações (Amarela)
        const specLabel = new THREE.Mesh(new THREE.CylinderGeometry(0.86, 0.86, 0.3, 32, 1, true, 0, Math.PI), matLabelYellow);
        specLabel.position.set(0, -0.2, 0);
        specLabel.rotation.y = -Math.PI / 1.5; // Virada para a diagonal
        tankGroup.add(specLabel);

        pumpGroup.add(tankGroup);

        // 3. Motor (Cilindro e bloco preto na base com aletas)
        const motorGroup = new THREE.Group();
        motorGroup.position.set(-0.3, 1.0, 0);

        const motorBody = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.7, 1.4, 24), matBlack);
        motorBody.rotation.z = Math.PI / 2;
        motorBody.castShadow = true;
        motorGroup.add(motorBody);
        
        // Aletas de ventilação do motor
        for(let i = -0.6; i <= 0.6; i += 0.2) {
            const fin = new THREE.Mesh(new THREE.TorusGeometry(0.72, 0.02, 8, 24), matBlack);
            fin.position.x = i;
            fin.rotation.y = Math.PI / 2;
            motorGroup.add(fin);
        }
        pumpGroup.add(motorGroup);

        // 4. Voluta e Cabeça da Bomba (Cinzento-escuro à direita/frente)
        const pumpBodyGroup = new THREE.Group();
        pumpBodyGroup.position.set(0.4, 1.3, 0.2);

        // Corpo principal curvo da bomba
        const casing = new THREE.Mesh(new THREE.CylinderGeometry(0.65, 0.65, 1.8, 16), matDarkGrey);
        casing.rotation.x = Math.PI / 2;
        casing.castShadow = true;
        pumpBodyGroup.add(casing);

        // Conexão e tampa superior da bomba
        const pumpTop = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.8, 0.9), matDarkGrey);
        pumpTop.position.set(-0.1, 0.7, -0.3);
        pumpTop.castShadow = true;
        pumpBodyGroup.add(pumpTop);
        
        // Manômetro (Medidor de Pressão Redondo)
        const gaugeGroup = new THREE.Group();
        gaugeGroup.position.set(-0.4, 1.25, -0.3);
        
        const gaugeBase = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 0.08, 16), matDarkGrey);
        gaugeBase.rotation.y = Math.PI/2;
        gaugeGroup.add(gaugeBase);
        
        const gaugeFace = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.16, 0.03, 16), matLightGrey);
        gaugeFace.position.x = -0.05;
        gaugeFace.rotation.z = Math.PI/2;
        gaugeGroup.add(gaugeFace);
        
        const gaugeNeedle = new THREE.Mesh(new THREE.BoxGeometry(0.015, 0.14, 0.015), matBlack);
        gaugeNeedle.position.set(-0.07, 0.04, 0);
        gaugeNeedle.rotation.x = -Math.PI / 6;
        gaugeGroup.add(gaugeNeedle);
        pumpBodyGroup.add(gaugeGroup);

        // Outro cilindro vertical da tubulação traseira
        const pipeBack = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.35, 1.3, 16), matDarkGrey);
        pipeBack.position.set(0.4, 0.5, -0.5);
        pipeBack.castShadow = true;
        pumpBodyGroup.add(pipeBack);

        // Flange superior traseiro (Saída vertical)
        const flangeBack = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.45, 0.15, 16), matDarkGrey);
        flangeBack.position.set(0.4, 1.15, -0.5);
        pumpBodyGroup.add(flangeBack);

        // Conexão frontal de entrada (Flange com rosca)
        const inletGroup = new THREE.Group();
        inletGroup.position.set(-0.1, 0.2, 0.8);
        inletGroup.rotation.x = Math.PI / 6; // Angulado para cima como na foto

        // Base do flange
        const flangeBase = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.4, 0.4), matDarkGrey);
        flangeBase.rotation.z = -Math.PI/6;
        flangeBase.castShadow = true;
        inletGroup.add(flangeBase);
        
        // Parafusos nas flanges
        for(let py of [-0.15, 0.15]) {
            const boltIn = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.08, 6), matMetalLight);
            boltIn.position.set(py, 0.22, 0);
            boltIn.rotation.x = Math.PI/2;
            inletGroup.add(boltIn);
        }

        // Rosca de conexão metálica
        const threadPart = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.32, 0.4, 24), matMetalLight);
        threadPart.rotation.x = Math.PI / 2;
        threadPart.position.z = 0.25;
        threadPart.castShadow = true;
        inletGroup.add(threadPart);
        
        // Detalhe da rosca
        const threadEdge = new THREE.Mesh(new THREE.TorusGeometry(0.32, 0.04, 8, 24), matMetalLight);
        threadEdge.position.z = 0.45;
        inletGroup.add(threadEdge);

        pumpBodyGroup.add(inletGroup);
        pumpGroup.add(pumpBodyGroup);

        // 5. Caixa de Ligações Elétrica (Preta, angulada do lado esquerdo)
        const electBox = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.8, 0.8), matPlasticBlack);
        electBox.position.set(-1.1, 1.4, 0.6);
        electBox.rotation.y = Math.PI / 6; // Inclinada para a frente
        electBox.rotation.z = Math.PI / 18;
        electBox.castShadow = true;
        pumpGroup.add(electBox);

        // Fiação amarela/laranja inferior
        const wireGroup = new THREE.Group();
        const curve = new THREE.CatmullRomCurve3([
            new THREE.Vector3(-1.1, 0.9, 0.6),
            new THREE.Vector3(-1.0, 0.5, 0.7),
            new THREE.Vector3(-0.5, 0.4, 0.9),
            new THREE.Vector3(0.3, 0.4, 0.9),
            new THREE.Vector3(0.8, 0.5, 0.5),
            new THREE.Vector3(0.6, 0.8, 0.1)
        ]);
        const wireGeo = new THREE.TubeGeometry(curve, 30, 0.04, 8, false);
        const wire = new THREE.Mesh(wireGeo, matWire);
        wire.castShadow = true;
        wireGroup.add(wire);
        pumpGroup.add(wireGroup);

        // ==========================================
        // 6. TUBULAÇÃO DE ENTRADA (Cano frontal azul escuro)
        // ==========================================
        const pipeInGroup = new THREE.Group();
        // Curva da tubulação frontal descendo para simular o encanamento
        const curveIn = new THREE.CatmullRomCurve3([
            new THREE.Vector3(0.3, 1.25, 1.3),
            new THREE.Vector3(0.3, 1.0, 2.0),
            new THREE.Vector3(0.3, 0.1, 2.5),
            new THREE.Vector3(0.3, 0.08, 3.5)
        ]);
        const pipeInGeo = new THREE.TubeGeometry(curveIn, 30, 0.25, 16, false);
        const pipeIn = new THREE.Mesh(pipeInGeo, matPipeIn);
        pipeIn.castShadow = true;
        pipeInGroup.add(pipeIn);
        
        // Acoplamento de junção (Bucha/Emenda de PVC)
        const joinIn = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.2, 16), matDarkGrey);
        joinIn.position.set(0.3, 1.2, 1.4);
        joinIn.rotation.x = Math.PI / 4;
        pipeInGroup.add(joinIn);
        pumpGroup.add(pipeInGroup);

        // ==========================================
        // 7. TUBULAÇÃO DE SAÍDA (Cano vertical traseiro azul claro)
        // ==========================================
        const pipeOutGroup = new THREE.Group();
        // Curva do cano de descarga da bomba
        const curveOut = new THREE.CatmullRomCurve3([
            new THREE.Vector3(0.8, 2.45, -0.3),
            new THREE.Vector3(0.8, 2.8, -0.3),
            new THREE.Vector3(0.8, 3.1, -1.2),
            new THREE.Vector3(0.8, 3.1, -2.5)
        ]);
        const pipeOutGeo = new THREE.TubeGeometry(curveOut, 30, 0.25, 16, false);
        const pipeOut = new THREE.Mesh(pipeOutGeo, matPipeOut);
        pipeOut.castShadow = true;
        pipeOutGroup.add(pipeOut);
        
        // Luva de acoplamento da flange
        const joinOut = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.32, 0.15, 16), matDarkGrey);
        joinOut.position.set(0.8, 2.5, -0.3);
        pipeOutGroup.add(joinOut);
        pumpGroup.add(pipeOutGroup);

        scene.add(pumpGroup);

        // 8. ELEMENTOS DE ANIMAÇÃO DO FLUXO (Água)
        const flowObjects = [];
        const flowPointsIn = curveIn.getPoints(100);
        const flowPointsOut = curveOut.getPoints(100);

        // Função de criação de mini-esferas/partículas de fluxo
        function createFlowIndicator(color) {
            const flowGeo = new THREE.ConeGeometry(0.08, 0.16, 4);
            const flowMat = new THREE.MeshBasicMaterial({ color: color });
            const mesh = new THREE.Mesh(flowGeo, flowMat);
            scene.add(mesh);
            return mesh;
        }

        // Criar setas/esferas de água para entrada (Movimento em direção ao flange)
        const particleCount = 4;
        for (let i = 0; i < particleCount; i++) {
            flowObjects.push({
                mesh: createFlowIndicator(0x82afff),
                path: flowPointsIn,
                progress: (i / particleCount), // Distribuído
                direction: -1 // Entrando na bomba (reduz progress)
            });
        }

        // Criar para saída (Saindo da bomba)
        for (let i = 0; i < particleCount; i++) {
            flowObjects.push({
                mesh: createFlowIndicator(0xa3e2fc),
                path: flowPointsOut,
                progress: (i / particleCount),
                direction: 1 // Saindo da bomba (aumenta progress)
            });
        }

        // Chão de concreto simples
        const floorGeo = new THREE.PlaneGeometry(100, 100);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0xdddddd, roughness: 1.0 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        // Loop de Animação
        let clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            controls.update();

            // Animar indicadores do fluxo hidráulico
            const delta = clock.getDelta();
            const flowSpeed = 0.45; // Velocidade da água

            flowObjects.forEach(obj => {
                // Atualizar posição (progressão na curva)
                obj.progress += delta * flowSpeed * obj.direction;
                
                // Repetir fluxo (loop continuo)
                if (obj.direction > 0 && obj.progress > 1) {
                    obj.progress = 0;
                } else if (obj.direction < 0 && obj.progress < 0) {
                    obj.progress = 1;
                }

                // Definir coordenadas na curva
                const pointIndex = Math.floor(obj.progress * (obj.path.length - 1));
                const pos = obj.path[pointIndex];
                obj.mesh.position.copy(pos);

                // Orientar a direção do fluxo ao longo do encanamento
                if (pointIndex < obj.path.length - 1) {
                    const lookTarget = obj.direction > 0 ? obj.path[pointIndex + 1] : obj.path[pointIndex - 1];
                    if (lookTarget) {
                        obj.mesh.lookAt(lookTarget);
                        obj.mesh.rotateX(Math.PI/2); // Alinha o cone
                    }
                }
            });

            renderer.render(scene, camera);
        }
        animate();

        // Redimensionamento de tela
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
