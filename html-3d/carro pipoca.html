<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <title>Máquina de Pipocas 3D</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #eef2f5; }
        #info {
            position: absolute;
            top: 10px;
            width: 100%;
            text-align: center;
            font-family: sans-serif;
            font-size: 18px;
            color: #333;
            pointer-events: none;
            text-shadow: 1px 1px 2px white;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="info">Clique e arraste o rato para rodar | Scroll para zoom</div>
    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xeef2f5);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(8, 6, 12);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.target.set(0, 3, 0);

        // Luzes
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 20, 10);
        dirLight.castShadow = true;
        scene.add(dirLight);
        
        // Luz interna (para simular a lâmpada amarela da máquina)
        const pointLight = new THREE.PointLight(0xffddaa, 1.5, 10);
        pointLight.position.set(0, 5.5, 0);
        scene.add(pointLight);

        // Materiais principais
        const matRed = new THREE.MeshStandardMaterial({ color: 0xcc0000, roughness: 0.3 });
        const matBlack = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.8 });
        const matMetal = new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.8, roughness: 0.2 });
        const matGlass = new THREE.MeshPhysicalMaterial({ 
            color: 0xffffff, transmission: 0.7, opacity: 1, transparent: true, roughness: 0.1 
        });

        const cart = new THREE.Group();

        // 1. Base vermelha
        const baseGeo = new THREE.BoxGeometry(4, 3, 3);
        const base = new THREE.Mesh(baseGeo, matRed);
        base.position.y = 3;
        base.castShadow = true;
        base.receiveShadow = true;
        cart.add(base);

        // 2. Cabine de Vidro
        const glassGeo = new THREE.BoxGeometry(3.8, 3.5, 2.8);
        const glass = new THREE.Mesh(glassGeo, matGlass);
        glass.position.y = 6.25;
        cart.add(glass);

        // Pilares do vidro (cantos vermelhos)
        const pillarGeo = new THREE.BoxGeometry(0.2, 3.5, 0.2);
        const positions = [
            [1.8, 6.25, 1.3], [-1.8, 6.25, 1.3], 
            [1.8, 6.25, -1.3], [-1.8, 6.25, -1.3]
        ];
        positions.forEach(pos => {
            const pillar = new THREE.Mesh(pillarGeo, matRed);
            pillar.position.set(...pos);
            cart.add(pillar);
        });

        // 3. Teto preto
        const roofGeo = new THREE.BoxGeometry(4.4, 0.8, 3.4);
        const roof = new THREE.Mesh(roofGeo, matBlack);
        roof.position.y = 8.4;
        roof.castShadow = true;
        cart.add(roof);

        // 4. Panela interna suspensa
        const potGeo = new THREE.CylinderGeometry(0.7, 0.6, 0.8, 16);
        const pot = new THREE.Mesh(potGeo, matMetal);
        pot.position.y = 7;
        cart.add(pot);

        const suporteGeo = new THREE.BoxGeometry(0.1, 1, 0.1);
        const suporte = new THREE.Mesh(suporteGeo, matMetal);
        suporte.position.y = 7.5;
        cart.add(suporte);

        // 5. Rodas (estilo vintage com aros)
        const wheelGeo = new THREE.TorusGeometry(1.2, 0.15, 16, 32);
        const tireMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
        const rimMat = new THREE.MeshStandardMaterial({ color: 0xffffff });

        function createWheel() {
            const wheel = new THREE.Group();
            const tire = new THREE.Mesh(wheelGeo, tireMat);
            wheel.add(tire);
            // Aros cruzados
            for(let i=0; i<4; i++) {
                const spoke = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 2.4), rimMat);
                spoke.rotation.z = (Math.PI / 4) * i;
                wheel.add(spoke);
            }
            // Eixo central
            const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.2), matRed);
            hub.rotation.x = Math.PI / 2;
            wheel.add(hub);
            return wheel;
        }

        const wheelL = createWheel();
        wheelL.position.set(-1.2, 1.2, 1.8);
        cart.add(wheelL);

        const wheelR = createWheel();
        wheelR.position.set(-1.2, 1.2, -1.8);
        cart.add(wheelR);

        // 6. Pernas de apoio
        const legGeo = new THREE.CylinderGeometry(0.1, 0.1, 1.5);
        const leg1 = new THREE.Mesh(legGeo, matRed);
        leg1.position.set(1.5, 0.75, 1.2);
        cart.add(leg1);

        const leg2 = new THREE.Mesh(legGeo, matRed);
        leg2.position.set(1.5, 0.75, -1.2);
        cart.add(leg2);

        // Pegadeira (Alça)
        const handleGeo = new THREE.CylinderGeometry(0.05, 0.05, 2);
        const handle = new THREE.Mesh(handleGeo, matMetal);
        handle.rotation.x = Math.PI / 2;
        handle.position.set(2.2, 3.5, 0);
        cart.add(handle);

        const handleSuporte1 = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.5), matMetal);
        handleSuporte1.rotation.z = Math.PI / 2;
        handleSuporte1.position.set(2, 3.5, 0.8);
        cart.add(handleSuporte1);

        const handleSuporte2 = handleSuporte1.clone();
        handleSuporte2.position.set(2, 3.5, -0.8);
        cart.add(handleSuporte2);

        // 7. Pipocas no fundo do vidro
        const popGeo = new THREE.SphereGeometry(0.12, 6, 6);
        const popMat = new THREE.MeshStandardMaterial({ color: 0xffeebb, roughness: 0.9 });
        for(let i=0; i<250; i++) {
            const popcorn = new THREE.Mesh(popGeo, popMat);
            const px = (Math.random() - 0.5) * 3.4;
            const py = 4.6 + Math.random() * 0.4; // Base do vidro
            const pz = (Math.random() - 0.5) * 2.4;
            popcorn.position.set(px, py, pz);
            cart.add(popcorn);
        }

        scene.add(cart);

        // Chão
        const floorGeo = new THREE.PlaneGeometry(100, 100);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0xcccccc });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        // Loop de Animação
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
