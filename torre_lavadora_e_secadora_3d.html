<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo 3D - Torre Lavadora/Secadora Comercial</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #d1d5db; /* Tailwind gray-300 */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        #ui-layer {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 12px 24px;
            border-radius: 30px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            text-align: center;
            pointer-events: none;
            z-index: 10;
        }

        h1 { margin: 0; font-size: 16px; color: #1f2937; }
        p { margin: 4px 0 0 0; font-size: 12px; color: #6b7280; }
    </style>
</head>
<body>

    <div id="ui-layer">
        <h1>Torre Comercial de Lavagem 3D</h1>
        <p>Arraste para girar • Role para zoom</p>
    </div>

    <div id="canvas-container"></div>

    <script>
        let scene, camera, renderer, controls;

        function init() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xd1d5db); 
            scene.fog = new THREE.Fog(0xd1d5db, 5, 20);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(2, 1.5, 3.5);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.target.set(0, 1.0, 0); 
            controls.maxPolarAngle = Math.PI / 2 - 0.01;
            controls.minDistance = 2;
            controls.maxDistance = 10;

            setupLighting();
            buildMachine();
            buildEnvironment();

            window.addEventListener('resize', onWindowResize, false);
            animate();
        }

        function setupLighting() {
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);

            // Key light (Sol principal)
            const keyLight = new THREE.DirectionalLight(0xffffff, 0.8);
            keyLight.position.set(5, 8, 5);
            keyLight.castShadow = true;
            keyLight.shadow.mapSize.width = 2048;
            keyLight.shadow.mapSize.height = 2048;
            scene.add(keyLight);

            // Fill light para suavizar sombras
            const fillLight = new THREE.DirectionalLight(0xe0e7ff, 0.4);
            fillLight.position.set(-5, 3, 2);
            scene.add(fillLight);
            
            // Rim light (Luz de contorno para destacar o metal)
            const rimLight = new THREE.PointLight(0xffffff, 0.6);
            rimLight.position.set(0, 3, -5);
            scene.add(rimLight);
        }

        function buildMachine() {
            const machineGroup = new THREE.Group();

            // --- MATERIAIS ---
            const silverMaterial = new THREE.MeshStandardMaterial({ 
                color: 0xcccccc, 
                roughness: 0.3, 
                metalness: 0.8 
            });

            const blackPlastic = new THREE.MeshStandardMaterial({ 
                color: 0x111111, 
                roughness: 0.6, 
                metalness: 0.2 
            });

            const darkGlass = new THREE.MeshStandardMaterial({ 
                color: 0x050505, 
                roughness: 0.1, 
                metalness: 0.9,
                transparent: true,
                opacity: 0.85
            });

            // --- CHASSI ---
            const bodyWidth = 0.7;
            const bodyHeight = 2.0;
            const bodyDepth = 0.75;

            const chassisGeo = new THREE.BoxGeometry(bodyWidth, bodyHeight, bodyDepth);
            const chassis = new THREE.Mesh(chassisGeo, silverMaterial);
            chassis.position.set(0, bodyHeight / 2, 0); 
            chassis.castShadow = true;
            chassis.receiveShadow = true;
            machineGroup.add(chassis);

            // --- FENDAS DE VENTILAÇÃO (Topo) ---
            const slitGeo = new THREE.BoxGeometry(0.015, 0.06, 0.01);
            const slitMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
            for(let i = -10; i <= 10; i++) {
                const slit = new THREE.Mesh(slitGeo, slitMat);
                slit.position.set(i * 0.025, 1.95, bodyDepth / 2 + 0.001);
                machineGroup.add(slit);
            }

            // --- SECADORA (Porta Superior) ---
            const topDoorGroup = new THREE.Group();
            topDoorGroup.position.set(0, 1.5, bodyDepth / 2 + 0.01);

            // Aro preto grande
            const topRingGeo = new THREE.TorusGeometry(0.24, 0.035, 32, 64);
            const topRing = new THREE.Mesh(topRingGeo, blackPlastic);
            topRing.castShadow = true;
            topDoorGroup.add(topRing);

            // Vidro escuro
            const topGlassGeo = new THREE.CylinderGeometry(0.23, 0.21, 0.05, 32);
            const topGlass = new THREE.Mesh(topGlassGeo, darkGlass);
            topGlass.rotation.x = Math.PI / 2;
            topDoorGroup.add(topGlass);

            // Dobradiça/Detalhe lateral da secadora
            const topHingeGeo = new THREE.BoxGeometry(0.04, 0.3, 0.04);
            const topHinge = new THREE.Mesh(topHingeGeo, blackPlastic);
            topHinge.position.set(0.27, 0, 0);
            topDoorGroup.add(topHinge);

            machineGroup.add(topDoorGroup);

            // --- LAVADORA (Porta Inferior) ---
            const bottomDoorGroup = new THREE.Group();
            bottomDoorGroup.position.set(0, 0.5, bodyDepth / 2 + 0.01);

            // Aro preto um pouco menor
            const botRingGeo = new THREE.TorusGeometry(0.20, 0.04, 32, 64);
            const botRing = new THREE.Mesh(botRingGeo, blackPlastic);
            botRing.castShadow = true;
            bottomDoorGroup.add(botRing);

            // Vidro escuro inferior
            const botGlassGeo = new THREE.CylinderGeometry(0.19, 0.16, 0.06, 32);
            const botGlass = new THREE.Mesh(botGlassGeo, darkGlass);
            botGlass.rotation.x = Math.PI / 2;
            bottomDoorGroup.add(botGlass);

            // Dobradiça visível (Direita)
            const botHingeGeo = new THREE.BoxGeometry(0.05, 0.15, 0.05);
            const botHinge = new THREE.Mesh(botHingeGeo, blackPlastic);
            botHinge.position.set(0.23, 0, 0);
            bottomDoorGroup.add(botHinge);

            // Maçaneta (Esquerda)
            const botHandleGeo = new THREE.BoxGeometry(0.04, 0.1, 0.06);
            const botHandle = new THREE.Mesh(botHandleGeo, blackPlastic);
            botHandle.position.set(-0.23, 0, 0.02);
            bottomDoorGroup.add(botHandle);

            machineGroup.add(bottomDoorGroup);

            // --- PAINEL CENTRAL DE CONTROLE ---
            const panelCanvas = document.createElement('canvas');
            panelCanvas.width = 1024;
            panelCanvas.height = 256;
            const ctx = panelCanvas.getContext('2d');

            // Fundo do painel
            ctx.fillStyle = '#0a0a0a';
            ctx.fillRect(0, 0, 1024, 256);

            // Logo na extrema esquerda
            ctx.fillStyle = '#1e3a8a';
            ctx.beginPath();
            ctx.arc(80, 128, 30, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 20px Arial';
            ctx.fillText('BRAND', 45, 135);

            // Fechadura central prateada
            ctx.fillStyle = '#cccccc';
            ctx.beginPath();
            ctx.arc(512, 100, 15, 0, Math.PI*2);
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(512, 100);
            ctx.lineTo(505, 130);
            ctx.lineTo(519, 130);
            ctx.fill();

            // Função auxiliar para desenhar os displays digitais
            function drawDisplay(x, y, color, label) {
                // Borda cinza do display
                ctx.strokeStyle = '#555555';
                ctx.lineWidth = 6;
                ctx.strokeRect(x, y, 160, 80);
                
                // Fundo do display
                ctx.fillStyle = '#111111';
                ctx.fillRect(x, y, 160, 80);

                // Grid e textos
                ctx.fillStyle = color;
                ctx.font = 'bold 36px monospace';
                ctx.fillText(label, x + 35, y + 55);
                
                // Mini grid lateral
                for(let i=0; i<3; i++) {
                    for(let j=0; j<2; j++) {
                        ctx.fillRect(x + 110 + (j*15), y + 15 + (i*20), 10, 10);
                    }
                }
            }

            // Display Esquerdo (Grade Vermelha)
            drawDisplay(300, 140, '#ef4444', '30.0');

            // Display Direito (Grade Azul)
            drawDisplay(564, 140, '#3b82f6', '45.0');

            const panelTexture = new THREE.CanvasTexture(panelCanvas);
            panelTexture.anisotropy = renderer.capabilities.getMaxAnisotropy();
            const panelMat = new THREE.MeshBasicMaterial({ map: panelTexture });

            const panelGeo = new THREE.PlaneGeometry(0.7, 0.175);
            const panelMesh = new THREE.Mesh(panelGeo, panelMat);
            panelMesh.position.set(0, 1.05, bodyDepth / 2 + 0.005);
            machineGroup.add(panelMesh);

            scene.add(machineGroup);
        }

        function buildEnvironment() {
            // Chão
            const floorGeo = new THREE.PlaneGeometry(20, 20);
            const floorMat = new THREE.MeshStandardMaterial({ 
                color: 0x9ca3af, 
                roughness: 0.8,
                metalness: 0.1
            });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
