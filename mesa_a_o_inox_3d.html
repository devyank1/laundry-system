<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualização 3D - Mesa de Apoio Inox</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #f3f4f6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        #ui-layer {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.9);
            padding: 12px 24px;
            border-radius: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
            pointer-events: none;
            z-index: 10;
        }

        h1 { margin: 0; font-size: 16px; color: #1f2937; }
        p { margin: 4px 0 0 0; font-size: 12px; color: #6b7280; }
    </style>
</head>
<body>

    <div id="ui-layer">
        <h1>Mesa Aço Inox Comercial</h1>
        <p>Arraste para rodar • Role para zoom</p>
    </div>

    <div id="canvas-container"></div>

    <script>
        let scene, camera, renderer, controls;

        function init() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xf3f4f6); 
            scene.fog = new THREE.Fog(0xf3f4f6, 5, 25);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(2.5, 2, 3.5);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.target.set(0, 0.45, 0); 
            controls.maxPolarAngle = Math.PI / 2 - 0.01; // Impede que a câmera passe do chão
            controls.minDistance = 2;
            controls.maxDistance = 12;

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            // Luz principal (Sol)
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(5, 8, 5);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            scene.add(dirLight);

            // Luz de preenchimento para realçar reflexos
            const fillLight = new THREE.DirectionalLight(0xffffff, 0.5);
            fillLight.position.set(-5, 3, -5);
            scene.add(fillLight);
            
            const pointLight = new THREE.PointLight(0xffffff, 0.4);
            pointLight.position.set(0, 2, 2);
            scene.add(pointLight);

            buildTable();

            const floorGeo = new THREE.PlaneGeometry(30, 30);
            const floorMat = new THREE.MeshStandardMaterial({ 
                color: 0xcccccc, 
                roughness: 0.8, 
                metalness: 0.1 
            });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            window.addEventListener('resize', onWindowResize, false);
            
            animate();
        }

        function buildTable() {
            const tableGroup = new THREE.Group();

            // Material do Aço Inox (Muito metalness, pouco roughness)
            const inoxMaterial = new THREE.MeshStandardMaterial({ 
                color: 0xdddddd, 
                roughness: 0.25, 
                metalness: 0.9 
            });

            // Material da Borracha (Preto fosco)
            const rubberMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x111111, 
                roughness: 0.9, 
                metalness: 0.1 
            });

            const tableWidth = 2.0;
            const tableDepth = 0.8;
            const tableHeight = 0.9;
            const legRadius = 0.02;

            // Tampo Superior
            const topGeo = new THREE.BoxGeometry(tableWidth, 0.04, tableDepth);
            const topMesh = new THREE.Mesh(topGeo, inoxMaterial);
            topMesh.position.set(0, tableHeight, 0);
            topMesh.castShadow = true;
            topMesh.receiveShadow = true;
            tableGroup.add(topMesh);

            // Prateleira Inferior (Cerca de 30% da altura)
            const shelfGeo = new THREE.BoxGeometry(tableWidth - 0.05, 0.02, tableDepth - 0.05);
            const shelfMesh = new THREE.Mesh(shelfGeo, inoxMaterial);
            shelfMesh.position.set(0, tableHeight * 0.3, 0);
            shelfMesh.castShadow = true;
            shelfMesh.receiveShadow = true;
            tableGroup.add(shelfMesh);

            // Posições das pernas (Recuadas dos cantos)
            const xOffset = (tableWidth / 2) - 0.05;
            const zOffset = (tableDepth / 2) - 0.05;
            const legPositions = [
                [xOffset, zOffset],
                [-xOffset, zOffset],
                [xOffset, -zOffset],
                [-xOffset, -zOffset]
            ];

            const legGeo = new THREE.CylinderGeometry(legRadius, legRadius, tableHeight, 32);
            const footGeo = new THREE.CylinderGeometry(legRadius + 0.005, legRadius + 0.002, 0.04, 32);

            legPositions.forEach(pos => {
                // Perna de Inox
                const leg = new THREE.Mesh(legGeo, inoxMaterial);
                leg.position.set(pos[0], tableHeight / 2, pos[1]);
                leg.castShadow = true;
                leg.receiveShadow = true;
                tableGroup.add(leg);

                // Pé de borracha
                const foot = new THREE.Mesh(footGeo, rubberMaterial);
                foot.position.set(pos[0], 0.02, pos[1]);
                foot.castShadow = true;
                tableGroup.add(foot);
            });

            scene.add(tableGroup);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update(); 
            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
