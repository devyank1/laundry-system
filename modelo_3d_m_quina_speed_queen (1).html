<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo 3D - Torre Lavadora/Secadora Speed Queen</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #e5e7eb; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        #ui-layer {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.9);
            padding: 12px 24px;
            border-radius: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
            pointer-events: none;
            z-index: 10;
        }

        h1 { margin: 0; font-size: 16px; color: #1f2937; }
        p { margin: 4px 0 0 0; font-size: 12px; color: #6b7280; }
        #canvas-container { width: 100vw; height: 100vh; display: block; }
    </style>
    <!-- Three.js e OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="ui-layer">
        <h1>Torre Speed Queen 3D</h1>
        <p>Arraste para rodar • Role para zoom</p>
    </div>
    
    <div id="canvas-container"></div>

    <script>
        let scene, camera, renderer, controls;

        init();
        animate();

        function init() {
            const container = document.getElementById('canvas-container');

            // 1. Configuração Básica da Cena
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xe5e7eb); // Cinza claro
            scene.fog = new THREE.Fog(0xe5e7eb, 5, 20);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(2, 1.5, 3.5); 

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.target.set(0, 1.0, 0); 
            controls.maxPolarAngle = Math.PI / 2 - 0.01;
            controls.minDistance = 1.5;
            controls.maxDistance = 10;

            // 2. Iluminação Profissional
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.7);
            dirLight.position.set(3, 5, 4);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            scene.add(dirLight);

            const fillLight = new THREE.DirectionalLight(0xffffff, 0.3);
            fillLight.position.set(-3, 3, 2);
            scene.add(fillLight);

            // 3. Materiais Base
            const whiteMetal = new THREE.MeshStandardMaterial({ 
                color: 0xf9fafb, 
                roughness: 0.4, 
                metalness: 0.1 
            });
            
            const darkGlass = new THREE.MeshStandardMaterial({ 
                color: 0x111111, 
                roughness: 0.1, 
                metalness: 0.8 
            });

            const chromeMetal = new THREE.MeshStandardMaterial({
                color: 0xcccccc,
                roughness: 0.2,
                metalness: 0.9
            });

            // Grupo Principal da Máquina
            const staxMachine = new THREE.Group();

            // --- CHASSI PRINCIPAL ---
            const bodyWidth = 0.68;
            const bodyHeight = 1.98;
            const bodyDepth = 0.71;

            const chassisGeo = new THREE.BoxGeometry(bodyWidth, bodyHeight, bodyDepth);
            const chassis = new THREE.Mesh(chassisGeo, whiteMetal);
            chassis.position.set(0, bodyHeight / 2, 0); 
            chassis.castShadow = true;
            chassis.receiveShadow = true;
            staxMachine.add(chassis);

            // Linhas de detalhe laterais e separador
            const separatorGeo = new THREE.BoxGeometry(bodyWidth + 0.002, 0.005, bodyDepth + 0.002);
            const separatorMat = new THREE.MeshBasicMaterial({ color: 0x9ca3af });
            const separator1 = new THREE.Mesh(separatorGeo, separatorMat);
            separator1.position.set(0, 0.95, 0); // Divisão Lavadora/Painel
            staxMachine.add(separator1);
            
            const separator2 = new THREE.Mesh(separatorGeo, separatorMat);
            separator2.position.set(0, 1.15, 0); // Divisão Painel/Secadora
            staxMachine.add(separator2);

            // --- LAVADORA (Parte Inferior) ---
            const washerDoorRadius = 0.22;
            const washerRingGeo = new THREE.TorusGeometry(washerDoorRadius, 0.03, 32, 64);
            const washerRing = new THREE.Mesh(washerRingGeo, whiteMetal);
            washerRing.position.set(0, 0.45, bodyDepth / 2 + 0.01);
            washerRing.castShadow = true;
            staxMachine.add(washerRing);

            const innerRingGeo = new THREE.TorusGeometry(washerDoorRadius - 0.02, 0.015, 16, 64);
            const innerRing = new THREE.Mesh(innerRingGeo, chromeMetal);
            innerRing.position.set(0, 0.45, bodyDepth / 2 + 0.015);
            staxMachine.add(innerRing);

            const washerGlassGeo = new THREE.CylinderGeometry(washerDoorRadius - 0.01, washerDoorRadius - 0.04, 0.06, 32);
            const washerGlass = new THREE.Mesh(washerGlassGeo, darkGlass);
            washerGlass.rotation.x = Math.PI / 2;
            washerGlass.position.set(0, 0.45, bodyDepth / 2);
            staxMachine.add(washerGlass);

            // Puxador da Lavadora
            const handleGeo = new THREE.BoxGeometry(0.04, 0.15, 0.04);
            const handle = new THREE.Mesh(handleGeo, whiteMetal);
            handle.position.set(-0.25, 0.45, bodyDepth / 2 + 0.02);
            handle.castShadow = true;
            staxMachine.add(handle);

            // Dispenser de sabão
            const dispenserGeo = new THREE.BoxGeometry(0.18, 0.06, 0.01);
            const dispenser = new THREE.Mesh(dispenserGeo, whiteMetal);
            dispenser.position.set(0.2, 0.85, bodyDepth / 2 + 0.005);
            
            // Relevo do dispenser
            const dispenserBorder = new THREE.Mesh(new THREE.BoxGeometry(0.185, 0.065, 0.005), separatorMat);
            dispenserBorder.position.set(0.2, 0.85, bodyDepth / 2 + 0.002);
            staxMachine.add(dispenser);
            staxMachine.add(dispenserBorder);

            // --- SECADORA (Parte Superior) ---
            const dryerDoorWidth = 0.48;
            const dryerDoorHeight = 0.45;
            const dryerDoorGeo = new THREE.BoxGeometry(dryerDoorWidth, dryerDoorHeight, 0.02);
            const dryerDoor = new THREE.Mesh(dryerDoorGeo, whiteMetal);
            dryerDoor.position.set(0, 1.55, bodyDepth / 2 + 0.01);
            dryerDoor.castShadow = true;
            staxMachine.add(dryerDoor);

            const dryerGlassGeo = new THREE.BoxGeometry(0.35, 0.25, 0.025);
            const dryerGlass = new THREE.Mesh(dryerGlassGeo, darkGlass);
            dryerGlass.position.set(0, 1.55, bodyDepth / 2 + 0.015);
            staxMachine.add(dryerGlass);

            // Puxador da Secadora
            const dryerHandle = new THREE.Mesh(handleGeo, whiteMetal);
            dryerHandle.position.set(-0.20, 1.55, bodyDepth / 2 + 0.03);
            dryerHandle.castShadow = true;
            staxMachine.add(dryerHandle);

            // --- PAINEL DE CONTROLE CENTRAL ---
            const panelCanvas = document.createElement('canvas');
            panelCanvas.width = 1024;
            panelCanvas.height = 256;
            const ctx = panelCanvas.getContext('2d');

            // Fundo preto
            ctx.fillStyle = '#111111';
            ctx.fillRect(0, 0, 1024, 256);

            // Borda interna
            ctx.strokeStyle = '#333333';
            ctx.lineWidth = 6;
            ctx.strokeRect(15, 15, 994, 226);

            // Detalhes vermelhos sutis e Logo
            ctx.fillStyle = '#ff0000';
            ctx.fillRect(490, 40, 44, 4);
            
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 36px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('Speed Queen', 512, 80);
            
            // Símbolo "Q" simulado
            ctx.beginPath();
            ctx.arc(512, 130, 25, 0, Math.PI * 2);
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 4;
            ctx.stroke();

            // Display Esquerdo (Lavadora)
            ctx.fillStyle = '#00ff00';
            ctx.font = 'bold 70px "Courier New", monospace';
            ctx.fillText('27', 280, 140);
            
            // Luzes indicadoras lado esquerdo
            ctx.fillStyle = '#ff0000';
            ctx.beginPath(); ctx.arc(150, 100, 5, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#00ff00';
            ctx.beginPath(); ctx.arc(180, 100, 5, 0, Math.PI*2); ctx.fill();

            // Display Direito (Secadora)
            ctx.fillStyle = '#00ff00';
            ctx.fillText('31', 750, 140);

            // Luzes indicadoras lado direito
            ctx.fillStyle = '#00ff00';
            ctx.beginPath(); ctx.arc(620, 100, 5, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(650, 100, 5, 0, Math.PI*2); ctx.fill();

            // Botões do painel
            ctx.fillStyle = '#555555';
            for(let i = 0; i < 4; i++) {
                // Lavadora botoes
                ctx.fillRect(150 + (i*60), 170, 45, 25);
                ctx.fillRect(150 + (i*60), 200, 45, 15); 
                // Secadora botoes
                ctx.fillRect(620 + (i*60), 170, 45, 25);
                ctx.fillRect(620 + (i*60), 200, 45, 15);
            }

            const panelTexture = new THREE.CanvasTexture(panelCanvas);
            panelTexture.anisotropy = renderer.capabilities.getMaxAnisotropy();
            const panelMaterial = new THREE.MeshBasicMaterial({ map: panelTexture });

            const panelGeo = new THREE.PlaneGeometry(0.66, 0.16);
            const panelMesh = new THREE.Mesh(panelGeo, panelMaterial);
            panelMesh.position.set(0, 1.05, bodyDepth / 2 + 0.005); 
            staxMachine.add(panelMesh);
            
            // Moldura do painel (Aquele ângulo inclinado nas bordas)
            const panelBezelGeo = new THREE.BoxGeometry(0.68, 0.20, 0.01);
            const panelBezelMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.6 });
            const panelBezel = new THREE.Mesh(panelBezelGeo, panelBezelMat);
            panelBezel.position.set(0, 1.05, bodyDepth / 2);
            staxMachine.add(panelBezel);

            scene.add(staxMachine);

            // Chão sutil
            const floorGeo = new THREE.PlaneGeometry(20, 20);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x9ca3af, roughness: 0.8 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            window.addEventListener('resize', onWindowResize, false);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
